name: AI Documentary Video Maker Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (GitHub Release tag)"
        required: true
        type: string
      title:
        description: "Optional Documentary Title"
        required: false
        default: ""
        type: string
      subtitles:
        description: "Burn subtitles into video (true/false)"
        required: false
        default: "true"
        type: string
      bg_music:
        description: "Include subtle background music (true/false)"
        required: false
        default: "true"
        type: string

permissions:
  contents: write

jobs:
  build-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg, Bengali Fonts, and SVG Renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-core \
            fonts-beng \
            librsvg2-bin \
            fontconfig
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Documentary Pipeline
        env:
          JOB_ID: ${{ inputs.job_id }}
          DOC_TITLE: ${{ inputs.title }}
          BURN_SUBTITLES: ${{ inputs.subtitles }}
          ENABLE_BG_MUSIC: ${{ inputs.bg_music }}
          WORK_DIR: /tmp/doc_job
          WHISPER_MODEL: small
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python processor/pipeline.py
