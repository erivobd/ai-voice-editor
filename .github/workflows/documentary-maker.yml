name: AI Documentary Video Maker Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (GitHub Release tag)"
        required: true
        type: string
      title:
        description: "Optional Documentary Title"
        required: false
        default: ""
        type: string
      subtitles:
        description: "Burn subtitles into video (true/false)"
        required: false
        default: "true"
        type: string
      bg_music:
        description: "Include subtle background music (true/false)"
        required: false
        default: "true"
        type: string
      video_theme:
        description: "Animation Theme (cinematic_dark, vox_colorful, editorial_paper, vibrant_gradient, minimal_light, crimson_noir)"
        required: false
        default: "cinematic_dark"
        type: string

permissions:
  contents: write

jobs:
  build-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20 (for Remotion Graphics)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg, Bengali Fonts, HarfBuzz/RAQM, and Chromium Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-core \
            fonts-beng \
            librsvg2-bin \
            fontconfig \
            libfribidi-dev \
            libharfbuzz-dev \
            libraqm-dev \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 || true
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/HindSiliguri-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-Bold.ttf"
          curl -fsSL -o assets/fonts/HindSiliguri-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-SemiBold.ttf"
          curl -fsSL -o assets/fonts/HindSiliguri-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-Regular.ttf"
          sudo cp assets/fonts/*.ttf /usr/local/share/fonts/
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Remotion & Chromium Headless Shell
        run: |
          cd remotion
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Run AI Documentary Pipeline
        env:
          JOB_ID: ${{ inputs.job_id }}
          DOC_TITLE: ${{ inputs.title }}
          BURN_SUBTITLES: ${{ inputs.subtitles }}
          ENABLE_BG_MUSIC: ${{ inputs.bg_music }}
          VIDEO_THEME: ${{ inputs.video_theme }}
          WORK_DIR: /tmp/doc_job
          WHISPER_MODEL: small
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python processor/pipeline.py
