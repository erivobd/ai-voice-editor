name: Build Documentary Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Documentary title from web app'
        required: false
        default: 'documentary'
        type: string
      video_title:
        description: 'Optional documentary title'
        required: false
        default: 'documentary'
        type: string
      audio_url:
        description: 'Direct URL or repo path to voiceover audio (.mp3/.wav)'
        required: false
        type: string
      bg_music:
        description: 'Enable background music'
        required: false
        default: 'true'
        type: string
      job_id:
        description: 'Optional job ID from web app'
        required: false
        type: string
      subtitles:
        description: 'Enable subtitles'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write

jobs:
  build-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      AUDIO_URL: ${{ github.event.inputs.audio_url }}
      ENABLE_BG_MUSIC: ${{ github.event.inputs.bg_music || 'true' }}
      VIDEO_TITLE: ${{ github.event.inputs.title || github.event.inputs.video_title || 'documentary' }}
      JOB_ID: ${{ github.event.inputs.job_id }}
      ENABLE_SUBTITLES: ${{ github.event.inputs.subtitles || 'true' }}
      WHISPER_MODEL: small

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, HarfBuzz/RAQM & Hind Siliguri Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig libfribidi-dev libharfbuzz-dev libraqm-dev
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/HindSiliguri-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-Bold.ttf"
          curl -fsSL -o assets/fonts/HindSiliguri-SemiBold.ttf "https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-SemiBold.ttf"
          curl -fsSL -o assets/fonts/HindSiliguri-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/hindsiliguri/HindSiliguri-Regular.ttf"
          sudo cp assets/fonts/*.ttf /usr/local/share/fonts/
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run documentary pipeline
        run: |
          python main.py

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
