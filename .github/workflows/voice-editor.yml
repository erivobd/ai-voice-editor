
name: AI Voice Editor

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Voice editing job ID"
        required: true
        type: string
      action:
        description: "Processing action"
        required: true
        type: choice
        options:
          - analyze
          - render

permissions:
  contents: write

concurrency:
  group: voice-editor-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  voice-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JOB_ID: ${{ inputs.job_id }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORK_DIR: /tmp/voice_job
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Validate project files
        run: |
          test -f analyze.py
          test -f render.py
          test -f requirements.txt
          test -n "$GEMINI_API_KEY"
          echo "Project files validated."

      - name: Prepare job directory
        run: |
          mkdir -p "$WORK_DIR"

      - name: Download job assets
        run: |
          gh release download "$JOB_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$WORK_DIR"

          echo "Downloaded files:"
          ls -lah "$WORK_DIR"

      - name: Verify original audio
        run: |
          COUNT=$(find "$WORK_DIR" -maxdepth 1 -type f \
            -name 'original_audio.*' | wc -l)

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one original_audio file."
            echo "Found: $COUNT"
            ls -lah "$WORK_DIR"
            exit 1
          fi

          echo "Original audio verified."

      - name: Analyze recording with Gemini
        if: ${{ inputs.action == 'analyze' }}
        run: |
          python analyze.py

          test -f "$WORK_DIR/report.json"
          test -f "$WORK_DIR/approved_plan.json"

          echo "Gemini analysis completed."

      - name: Automatically render edited audio
        if: ${{ inputs.action == 'analyze' || inputs.action == 'render' }}
        run: |
          python render.py

          test -f "$WORK_DIR/final_edited.mp3"
          test -f "$WORK_DIR/final_edited.wav"

          echo "Audio rendering completed."

      - name: Upload all results
        if: ${{ success() }}
        run: |
          FILES=()

          for FILE in \
            report.json \
            approved_plan.json \
            transcript.srt \
            editing_report.json \
            final_edited.mp3 \
            final_edited.wav
          do
            if [ -f "$WORK_DIR/$FILE" ]; then
              FILES+=("$WORK_DIR/$FILE")
            fi
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No output files found."
            exit 1
          fi

          gh release upload "$JOB_ID" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "All available results uploaded."

      - name: Publish failure status
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          work = Path(os.environ["WORK_DIR"])
          work.mkdir(parents=True, exist_ok=True)

          status = {
              "status": "error",
              "stage": "failed",
              "message": "Processing failed. Check GitHub Actions logs.",
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          (work / "status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

          gh release upload "$JOB_ID" "$WORK_DIR/status.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
