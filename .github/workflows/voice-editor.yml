
name: AI Voice Editor

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Voice editing job ID"
        required: true
        type: string
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - analyze
          - render

permissions:
  contents: write

concurrency:
  group: voice-editor-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  voice-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate project files
        run: |
          test -f analyze.py
          test -f render.py
          test -f requirements.txt
          echo "Project files found successfully."

      - name: Analyze recording
        if: ${{ inputs.action == 'analyze' }}
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python analyze.py

      - name: Render approved edits
        if: ${{ inputs.action == 'render' }}
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python render.py

      - name: Publish failure status
        if: ${{ failure() }}
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          job_id = os.environ["JOB_ID"]
          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]

          api = f"https://api.github.com/repos/{repository}/releases/tags/{job_id}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          try:
              request = urllib.request.Request(api, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.loads(response.read().decode())

              status = {
                  "status": "error",
                  "stage": "failed",
                  "message": "Processing failed. Check the GitHub Actions run log for details.",
                  "updated_at": datetime.now(timezone.utc).isoformat()
              }

              data = json.dumps(status).encode()
              upload_url = (
                  f"https://uploads.github.com/repos/{repository}"
                  f"/releases/{release['id']}/assets?name=status.json"
              )

              for asset in release.get("assets", []):
                  if asset["name"] == "status.json":
                      delete_url = (
                          f"https://api.github.com/repos/{repository}"
                          f"/releases/assets/{asset['id']}"
                      )
                      delete_request = urllib.request.Request(
                          delete_url,
                          headers=headers,
                          method="DELETE"
                      )
                      with urllib.request.urlopen(delete_request, timeout=30):
                          pass
                      break

              upload_headers = dict(headers)
              upload_headers["Content-Type"] = "application/json"

              upload_request = urllib.request.Request(
                  upload_url,
                  data=data,
                  headers=upload_headers,
                  method="POST"
              )

              with urllib.request.urlopen(upload_request, timeout=30):
                  print("Failure status published successfully.")

          except Exception as error:
              print(f"Could not publish failure status: {error}")
              raise
          PY
