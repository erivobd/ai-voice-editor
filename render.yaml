services:
  - type: web
    name: ai-documentary-video-maker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_WORKFLOW_FILE
        value: documentary-maker.yml
      - key: GITHUB_BRANCH
        value: main
      - key: APP_ACCESS_PIN
        sync: false
